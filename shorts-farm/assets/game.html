<!doctype html><meta charset=utf-8>
<style>html,body{margin:0;background:#07070d;overflow:hidden}canvas{display:block}</style>
<canvas id=c width=1080 height=600></canvas>
<script>
// Детерминированный "залипательный" фон: шарики в круге с вращающейся планкой.
// Каждый удар о стену рождает новый шарик. Свой код, без чужих прав.
const cv=document.getElementById('c'),g=cv.getContext('2d');
let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const CX=540,CY=300,R=285,MAX=90;
let balls=[{x:CX,y:CY-120,vx:260,vy:0,r:15,h:190}],ang=0,hue=190,t=0;
function spawn(b){if(balls.length>=MAX)return;const a=rnd()*6.28;balls.push({x:b.x,y:b.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,r:9+rnd()*8,h:(b.h+40+rnd()*60)%360})}
function step(dt){
  ang+=dt*1.7;const w=1.7;
  const ax=Math.cos(ang),ay=Math.sin(ang),L=210,BW=7;
  for(const b of balls.slice()){
    b.vy+=520*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
    let dx=b.x-CX,dy=b.y-CY,d=Math.hypot(dx,dy);
    if(d+b.r>R){const nx=dx/d,ny=dy/d,dot=b.vx*nx+b.vy*ny;if(dot>0){b.vx-=1.98*dot*nx;b.vy-=1.98*dot*ny;b.x=CX+nx*(R-b.r);b.y=CY+ny*(R-b.r);hue=(hue+9)%360;spawn(b)}}
    const px=b.x-CX,py=b.y-CY,s=Math.max(-L,Math.min(L,px*ax+py*ay)),qx=CX+ax*s,qy=CY+ay*s;
    let ex=b.x-qx,ey=b.y-qy,ed=Math.hypot(ex,ey);
    if(ed<b.r+BW&&ed>0){const nx=ex/ed,ny=ey/ed,vbx=-w*(qy-CY),vby=w*(qx-CX),rv=(b.vx-vbx)*nx+(b.vy-vby)*ny;
      if(rv<0){b.vx-=1.9*rv*nx;b.vy-=1.9*rv*ny}b.x=qx+nx*(b.r+BW);b.y=qy+ny*(b.r+BW)}
  }
}
window.frame=function(dt){
  for(let i=0;i<6;i++)step(dt/6);t+=dt;
  g.fillStyle='rgba(7,7,13,0.22)';g.fillRect(0,0,1080,600);
  g.lineWidth=8;g.strokeStyle=`hsl(${hue},90%,60%)`;g.shadowColor=g.strokeStyle;g.shadowBlur=24;
  g.beginPath();g.arc(CX,CY,R,0,6.2832);g.stroke();
  const ax=Math.cos(ang),ay=Math.sin(ang);g.beginPath();g.moveTo(CX-ax*210,CY-ay*210);g.lineTo(CX+ax*210,CY+ay*210);g.lineWidth=14;g.lineCap='round';g.stroke();
  for(const b of balls){g.fillStyle=`hsl(${b.h},95%,62%)`;g.shadowColor=g.fillStyle;g.shadowBlur=18;g.beginPath();g.arc(b.x,b.y,b.r,0,6.2832);g.fill()}
  g.shadowBlur=0;
};
g.fillStyle='#07070d';g.fillRect(0,0,1080,600);
</script>
